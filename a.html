<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Study Session Tracker</title>
    <link rel="stylesheet" href="a.css" />
    <script src="a.js" defer></script>
  </head>
  <body>
    <div class="container">
      <h1>📚 Study Session Tracker</h1>

      <div class="controls">
        <input type="text" id="taskInput" placeholder="what are you studying" />
        <button id="startBtn">Start</button>
        <button id="stopBtn" disabled>Stop</button>
      </div>

      <div class="timer-display" id="timerDisplay">00:00</div>
      <p class="quote" id="quote"></p>
      <div class="stats">
        <div class="stat-box">
          <span class="stat-number" id="totalSessions">0</span>
          <span class="stat-label">Sessions</span>
        </div>

        <div class="stat-box">
          <span class="stat-number" id="uniqueTasks">0</span>
          <span class="stat-label">Unique Tasks</span>
        </div>

        <div class="stat-box">
          <span class="stat-number" id="avgDuration">0s</span>
          <span class="stat-label">Avg Duration</span>
        </div>
      </div>
      <h2>Session Log</h2>
      <ul id="sessionList"></ul>
    </div>
  </body>
</html>
