<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>The Final Result</title>
    <link rel="stylesheet" href="a.css" />
    <script src="a.js" defer></script>
  </head>
  <body>
    <div class="card">
      <h1>Report Card Generator</h1>
      <div class="input-group">
        <label for="studentName">Student Name</label>
        <input type="text" id="studentName" placeholder="Enter full Name" />
      </div>
      <div class="input-group">
        <label for="mark1">Math Marks</label>
        <input type="text" id="mark1" placeholder="0-100" />
      </div>
      <div class="input-group">
        <label for="mark2">Science Marks</label>
        <input type="text" id="mark2" placeholder="0-100" />
      </div>
      <div class="input-group">
        <label for="mark3">English Marks</label>
        <input type="text" id="mark3" placeholder="0-100" />
      </div>

      <button id="generateBtn">Generate Report</button>
      <p id="errorMsg" class="error"></p>
      <div id="reportOutput" class="report"></div>
    </div>
  </body>
</html>
